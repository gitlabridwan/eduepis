<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>Edu Episians — Luring</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #0b1f3a; font-family: Inter, system-ui, sans-serif; text-align: center; background: radial-gradient(circle at 50% 30%, #dbeafe 0, transparent 35%), #fff; }
      main { max-width: 420px; }
      .mark { display: grid; width: 72px; height: 72px; margin: 0 auto 22px; place-items: center; color: #fff; font-size: 25px; font-weight: 800; border-radius: 22px; background: linear-gradient(145deg, #2563eb, #0b1f3a); box-shadow: 0 16px 36px rgba(37, 99, 235, .22); }
      h1 { margin: 0 0 10px; font-size: 1.65rem; letter-spacing: -.03em; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
      button { padding: 11px 17px; border: 0; border-radius: 999px; color: #fff; font: 700 .9rem inherit; background: #2563eb; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">EE</div>
      <h1>Koneksi internet terputus</h1>
      <p>Shell Edu Episians tetap tersedia, tetapi materi pembelajaran dari server memerlukan koneksi internet.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
